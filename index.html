
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple digital library for managing your books.">
  <title>My Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1>My Library</h1>
      <p>Keep track of the books you're reading.</p>
    </div>

    <button class="add-book-btn" id="open-dialog">
      + Add New Book
    </button>
  </header>

  <main class="main-content">
    <section class="library-section">
      <div class="section-heading">
        <h2>Your Collection</h2>
        <p id="book-count">0 books</p>
      </div>

      <div class="book-grid" id="book-grid">
        <!-- Book cards are created with JavaScript. -->
      </div>
    </section>
  </main>

  <dialog id="book-dialog">
    <div class="dialog-header">
      <h2>Add a New Book</h2>
      <button
        type="button"
        class="close-dialog"
        id="close-dialog"
        aria-label="Close form"
      >&times;</button>
    </div>

    <form id="book-form">
      <div class="form-group">
        <label for="title">Book Title</label>
        <input
          type="text"
          id="title"
          name="title"
          placeholder="Enter book title"
          required
        >
      </div>

      <div class="form-group">
        <label for="author">Author</label>
        <input
          type="text"
          id="author"
          name="author"
          placeholder="Enter author's name"
          required
        >
      </div>

      <div class="form-group">
        <label for="pages">Number of Pages</label>
        <input
          type="number"
          id="pages"
          name="pages"
          placeholder="e.g. 250"
          min="1"
          step="1"
          required
        >
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="read" name="read">
        <label for="read">I have already read this book</label>
      </div>

      <button type="submit" class="submit-btn">
        Add to Library
      </button>
    </form>
  </dialog>

  <footer class="footer">
    <p>Built with HTML, CSS and JavaScript.</p>
  </footer>
</body>
</html>
